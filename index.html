.row{display:flex;gap:8px;margin-top:10px}
.row button,.ghost{flex:1;font-weight:900;font-size:14px;padding:10px;border:3px solid var(--ink);border-radius:12px;background:#fff;color:var(--ink);box-shadow:0 3px 0 #0003}

 for(const [i,it] of r.items){const x=xOf(r,i,ms);if(x<-EDGE-1.4){dropItem(it);r.items.delete(i);continue;}
  it.g.position.x=x;
  const w=now-it.wob;if(it.g.userData.flesh){const f=it.g.userData.flesh;if(w<1.4){const s=Math.sin(w*26)*(1-w/1.4);f.scale.set(1+s*.08,1-s*.18,1-s*.06);f.rotation.y=Math.sin(w*17)*.08*(1-w/1.4);}else{f.scale.set(1,1,1);f.rotation.y=0;}}

}

function show(id){PANELS.forEach(p=>$(p).hidden=(p!==id));}
let best=ls.get('kl_best',null);
const bestTxt=()=>best?t('cnt',{n:best.c})+' / '+t('pt',{n:best.p}):t('none');
function applyLang(){
 document.documentElement.lang=lang==='zh'?'zh-Hant':lang;
 $('tTitle').innerHTML=t('title');$('tSub').textContent=t('sub');$('tHow').innerHTML=t('how');$('tCtl').textContent=t('ctl');$('tNote').textContent=t('note');
 $('nameIn').placeholder=t('name');$('rName').placeholder=t('name');$('startBtn').textContent=t('start');$('rankBtn').textContent=t('rank');
 $('tBest').textContent=t('best')+'：'+bestTxt();$('bKt').textContent=t('kiku');$('bLt').textContent=t('lemon');$('spdL').textContent=t('spd');$('keys').textContent=t('keys');
 $('againBtn').textContent=t('again');$('xBtn').textContent=t('xpost');$('rRank').textContent=t('rank');$('rTop').textContent=t('top');$('renameBtn').textContent=t('rename');
 $('rkTitle').textContent=t('rank');$('rkNote').textContent=t('rkNote');$('tabDay').textContent=t('today');$('tabAll').textContent=t('alltime');$('rankBack').textContent=t('back');
 $('langs').innerHTML=LANGS.map(([k,l])=>'<button data-l="'+k+'"'+(k===lang?' class="on"':'')+'>'+l+'</button>').join('');
}
$('langs').onclick=e=>{const b=e.target.closest('button');if(!b)return;lang=b.dataset.l;ls.set('kl_lang',lang);applyLang();};
const isPC=matchMedia('(hover:hover) and (pointer:fine)').matches;

// ===== ゲーム =====
let mode='title',G=null,demoT0=0,demoSeed=0,stopAt=0;
function showTitle(){mode='title';show('title');$('hud').hidden=true;$('btns').hidden=true;$('keys').hidden=true;$('big').textContent='';$('flash').style.opacity=0;
 $('nameIn').value=ls.get('kl_name','');$('tBest').textContent=t('best')+'：'+bestTxt();clearRun(RUN);clearLoose();demoSeed=SHOT?(+SHOT>>>0):(Math.random()*4294967296)>>>0;RUN=newRun(demoSeed);demoT0=performance.now();}
function big(h){const b=$('big');b.innerHTML=h;b.classList.remove('pop');void b.offsetWidth;b.classList.add('pop');}
function startGame(){
 ac();const n=$('nameIn').value.trim();if(n&&!badName(n))ls.set('kl_name',n);
 show(null);clearRun(RUN);clearLoose();RUN=null;
 G={st:null,offline:false,ready:false,c:0,p:0,lg:'',s:0,t0:0,why:'',cdT:performance.now()};
 mode='count';$('hud').hidden=false;$('btns').hidden=false;$('keys').hidden=!isPC;$('hCnt').textContent='0';$('hPt').textContent=t('pt',{n:0});
 $('flash').style.opacity=0;big(t('ready'));sCount(false);startLamp.material.emissiveIntensity=.2;
 const my=G;takeTicket().then(st=>{if(my!==G)return;if(st==null){G.offline=true;G.st=Date.now();}else G.st=st;});
}
function beginPlay(){RUN=newRun(K.seedOf(G.st));G.t0=performance.now();mode='play';big(t('go'));sCount(true);startLamp.material.emissiveIntensity=1.2;setTimeout(()=>{if(mode==='play')$('big').textContent='';},600);}
// ボタン（本物の指・キーだけ受け付ける）
function press(btn,ev){
 if(!ev||ev.isTrusted!==true)return;
 if(mode!=='play')return;
 const nowP=performance.now();let ts=ev&&ev.timeStamp;if(!(ts>0)||Math.abs(ts-nowP)>500)ts=nowP;
 const ms=ts-G.t0;const i=RUN.next,T=RUN.L.T(i);const e=Math.round(ms-T);const now=nowP/1000;
 hands[btn].t0=now;
 if(e>K.W){miss('pass',T+K.W,i);return;}
 const it=RUN.items.get(i);
 if(e< -K.W){ // 何もない所で押した
  if(btn===0){const f=makeKiku();f.position.set(0,BELT_Y+.07,.15);scene.add(f);loose.push(f);}else squirt(0,BELT_Y+.02,now);
  miss('early',ms,i);return;}
 if(btn!==RUN.L.K(i)){if(it)applyTop(it,btn,now);miss('wrong'+RUN.L.K(i),ms,i);return;}
 const pt=K.pts(e);if(it)applyTop(it,btn,now);
 RUN.next++;G.c++;G.p+=pt;G.lg+=K.enc(e);G.lastAt=T+e;
 (btn===0?sKiku:sLemon)(pt);ringT=now;
 $('hCnt').textContent=G.c;$('hPt').textContent=t('pt',{n:G.p});
 const J=$('judge'),[sx,sy]=screenOf(new THREE.Vector3(0,BELT_Y+1.55,0));J.style.left=sx+'px';J.style.top=sy+'px';
 J.textContent=t('j')[pt>=95?0:pt>=75?1:2];J.className='';void J.offsetWidth;J.className='on'+(pt>=95?' p':'');
}
function miss(kind,ms,i){
 mode='stop';G.s=Math.max(Math.round(ms),Math.ceil(G.lastAt||0));G.why=kind;G.stopMs=ms;stopAt=performance.now()/1000;
 sMiss();$('flash').style.opacity=.35;setTimeout(()=>{$('flash').style.opacity=0;},250);big(t('stop'));startLamp.material.emissiveIntensity=.1;
 if(navigator.vibrate)try{navigator.vibrate(200);}catch(e){}
 submit();setTimeout(()=>{if(mode==='stop')showResult();},1700);
}
const btnK=$('bK'),btnL=$('bL');
for(const [b,k] of [[btnK,0],[btnL,1]]){b.addEventListener('pointerdown',e=>{e.preventDefault();b.classList.add('dn');press(k,e);});
 const up=()=>b.classList.remove('dn');b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);b.addEventListener('pointerleave',up);b.addEventListener('contextmenu',e=>e.preventDefault());}
addEventListener('keydown',e=>{if(e.repeat)return;if(document.activeElement&&document.activeElement.tagName==='INPUT')return;
 const k=e.key;let b=-1;if(k==='ArrowLeft'||k==='a'||k==='A'||k==='f'||k==='F')b=0;else if(k==='ArrowRight'||k==='l'||k==='L'||k==='j'||k==='J')b=1;
 if(b>=0){e.preventDefault();(b?btnL:btnK).classList.add('dn');setTimeout(()=>(b?btnL:btnK).classList.remove('dn'),90);press(b,e);}
 else if((k===' '||k==='Enter')&&mode==='title'&&!$('title').hidden){e.preventDefault();startGame();}});

// ===== 結果 =====
function showResult(){
 mode='result';show('result');$('btns').hidden=true;$('keys').hidden=true;$('big').textContent='';
 $('rHead').textContent=t('stop');$('rWhy').textContent=t(G.why);
 $('rCnt').innerHTML=G.c+'<small>'+esc(t('cnt',{n:''}).trim()||'')+'</small>';$('rPt').textContent=t('pt',{n:G.p});
 $('rGrade').innerHTML='<small>'+esc(t('ttl'))+'</small>「'+esc(grade(G.c))+'」';
 $('rNew').textContent=G.newBest?t('newbest'):'';
 $('sendMsg').textContent=sendState.msg||'';$('sendMsg').className='note '+(sendState.cls||'');
 $('renameRow').hidden=!(sendState.canRename&&!ls.get('kl_name',''));$('rName').value='';
}
function postText(){return t('post',{c:G.c,p:G.p,g:grade(G.c)})+'\n'+TAGS;}
$('xBtn').onclick=()=>{if(!G)return;const u='https://x.com/intent/post?text='+encodeURIComponent(postText())+'&url='+encodeURIComponent(GAME_URL);const w=window.open(u,'_blank');if(!w)location.href=u;};
$('startBtn').onclick=startGame;$('againBtn').onclick=startGame;$('rTop').onclick=showTitle;
$('rankBtn').onclick=()=>openRank('d',false);$('rRank').onclick=()=>openRank('d',true);
$('rankBack').onclick=()=>{if(rankFrom)show('result');else show('title');};
$('tabDay').onclick=()=>openRank('d',rankFrom);$('tabAll').onclick=()=>openRank('all',rankFrom);

// ===== ランキング（Firebase：ft-green の kl の下） =====
const FB={apiKey:'AIzaSyCfCUAY7vhCFVF58tGOQzLCQsfPhp-Qi1A',databaseURL:'https://ft-green-default-rtdb.asia-southeast1.firebasedatabase.app'};
const NG=['ちんこ','ちんぽ','まんこ','せっくす','セックス','きんたま','レイプ','死ね','しね','殺す','ころす','ガイジ','キチガイ','きちがい','ニガー','チョン','支那','fuck','shit','bitch','cunt','pussy','nigger','nigga','faggot','retard','whore','slut','rape','porn','nazi','hitler','씨발','시발','병신','좆','肏','屄','屌','幹你','操你','婊子'];
const badName=s=>{const n=s.normalize('NFKC').toLowerCase().replace(/[\s・._\-ー〜~!！?？*＊]/g,'');return NG.some(w=>n.includes(w.normalize('NFKC').toLowerCase()));};
async function fetchR(url,opt){let err;for(let i=0;i<3;i++){try{return await fetch(url,opt);}catch(e){err=e;await new Promise(r=>setTimeout(r,400*(i+1)));}}throw err;}
async function fbAuth(){
 let a=ls.get('kl_auth',null);if(a&&a.exp>Date.now()+60000)return a;
 if(a&&a.refresh){try{const r=await fetchR('https://securetoken.googleapis.com/v1/token?key='+FB.apiKey,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'grant_type=refresh_token&refresh_token='+encodeURIComponent(a.refresh)});
  if(r.ok){const j=await r.json();a={uid:j.user_id,token:j.id_token,refresh:j.refresh_token,exp:Date.now()+(+j.expires_in)*1000};ls.set('kl_auth',a);return a;}}catch(_){}}
 const r=await fetchR('https://identitytoolkit.googleapis.com/v1/accounts:signUp?key='+FB.apiKey,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({returnSecureToken:true})});
 if(!r.ok)throw new Error('auth');const j=await r.json();a={uid:j.localId,token:j.idToken,refresh:j.refreshToken,exp:Date.now()+(+j.expiresIn)*1000};ls.set('kl_auth',a);return a;
}
fbAuth().catch(()=>{});
const DB=p=>FB.databaseURL+'/kl/'+p;
const Q=a=>'.json?auth='+encodeURIComponent(a.token);
const PUT=(url,body)=>fetchR(url,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
// ずる対策：始める前にサーバーの時計を書く。その時刻で流れてくる並びが決まる
function takeTicket(){
 return (async()=>{const a=await fbAuth();
  const r=await PUT(DB('runs/'+a.uid)+Q(a),{t:{'.sv':'timestamp'},v:K.V});
  if(!r.ok)throw new Error('ticket '+r.status);
  const j=await r.json();let st=j&&j.t;
  if(typeof st!=='number'){const g=await fetchR(DB('runs/'+a.uid+'/t')+Q(a));st=await g.json();}
  return typeof st==='number'?st:null;
 })().catch(e=>{console.warn(e);return null;});
}
const dayKey=ms=>Math.floor((ms+32400000)/86400000);
let sendState={};
async function submit(){
 const k=G.c*10000000+G.p;G.newBest=G.c>0&&(!best||k>best.c*10000000+best.p);if(G.newBest){best={c:G.c,p:G.p};ls.set('kl_best',best);}
 sendState={msg:'',cls:'',canRename:false};
 const setMsg=(m,c)=>{sendState.msg=m;sendState.cls=c;if(!$('result').hidden){$('sendMsg').textContent=m;$('sendMsg').className='note '+c;}};
 if(G.c<1){setMsg(t('zero'),'');return;}
 if(G.offline||G.st==null){setMsg(t('offline'),'err');return;}
 setMsg(t('sending'),'');
 try{
  const a=await fbAuth();
  const rec={n:ls.get('kl_name','')||t('anon'),c:G.c,p:G.p,k,s:G.s,st:G.st,lg:G.lg,v:K.V,t:{'.sv':'timestamp'}};
  const dk=dayKey(Date.now());const recD={...rec,dk};G.sent={rec,recD};
  const [cur,curD]=await Promise.all([fetchR(DB('all/scores/'+a.uid)+'.json').then(x=>x.ok?x.json():null).catch(()=>null),fetchR(DB('d/scores/'+a.uid)+'.json').then(x=>x.ok?x.json():null).catch(()=>null)]);
  const okAll=!cur||cur.k<k,okD=!curD||curD.dk!==dk||curD.k<k;
  if(okD){const res=await PUT(DB('d/scores/'+a.uid)+Q(a),recD);if(res.ok)G.sent.d=1;}
  if(okAll){const res=await PUT(DB('all/scores/'+a.uid)+Q(a),rec);if(res.ok)G.sent.all=1;}
  if(!G.sent.d&&!G.sent.all){setMsg(okAll||okD?t('senderr'):t('notbetter'),okAll||okD?'err':'');return;}
  sendState.canRename=true;
  const rk=await myRank(G.sent.d?'d':'all',a.uid);setMsg(t('sent',{r:rk||'?'}),'ok');
  if(!$('result').hidden&&!ls.get('kl_name',''))$('renameRow').hidden=false;
 }catch(e){console.warn(e);setMsg(t('senderr'),'err');}
}
$('renameBtn').onclick=async()=>{
 const n=$('rName').value.trim(),m=$('sendMsg');
 if(!n){m.textContent=t('needname');m.className='note err';return;}
 if(badName(n)){m.textContent=t('badname');m.className='note err';return;}
 ls.set('kl_name',n);if(!G||!G.sent)return;$('renameBtn').disabled=true;
 try{const a=await fbAuth();
  if(G.sent.d){const res=await PUT(DB('d/scores/'+a.uid)+Q(a),{...G.sent.recD,n});if(!res.ok)throw 0;}
  if(G.sent.all){const res=await PUT(DB('all/scores/'+a.uid)+Q(a),{...G.sent.rec,n});if(!res.ok)throw 0;}
  m.textContent=t('renamed');m.className='note ok';$('renameRow').hidden=true;
 }catch(e){m.textContent=t('senderr');m.className='note err';}
 $('renameBtn').disabled=false;
};
$('nameIn').addEventListener('change',()=>{const n=$('nameIn').value.trim();if(n&&badName(n)){$('nameIn').value='';return;}ls.set('kl_name',n);});
async function loadBoard(board){
 const today=dayKey(Date.now());
 const url=board==='d'?DB('d/scores')+'.json?orderBy=%22dk%22&equalTo='+today:DB('all/scores')+'.json?orderBy=%22k%22&limitToLast=300';
 const [d,h]=await Promise.all([fetch(url).then(r=>{if(!r.ok)throw 0;return r.json()}),fetch(DB('hidden')+'.json').then(r=>r.ok?r.json():null).catch(()=>null)]);
 return Object.entries(d||{}).map(([id,v])=>({...v,id})).filter(r=>!(h&&h[r.id])&&typeof r.k==='number').sort((a,b)=>b.k-a.k||a.t-b.t);
}
async function myRank(board,uid){try{const rows=await loadBoard(board);const i=rows.findIndex(r=>r.id===uid);return i>=0?i+1:null;}catch(e){return null;}}
let rankFrom=false;
async function openRank(board,fromResult){
 rankFrom=!!fromResult;show('rankPanel');$('tabDay').classList.toggle('on',board==='d');$('tabAll').classList.toggle('on',board==='all');
 const box=$('rankBox');box.innerHTML='<p>'+esc(t('loading'))+'</p>';
 try{const rows=await loadBoard(board);const myId=(ls.get('kl_auth',null)||{}).uid;
  let h='<table class="rank">'+rows.slice(0,100).map((r,i)=>'<tr'+(r.id===myId?' class="me"':'')+'><td class="r">'+(i+1)+'</td><td class="n">'+esc(r.n)+'<small>'+esc(grade(r.c))+'</small></td><td class="c">'+esc(t('cnt',{n:r.c}))+'<small>'+esc(t('pt',{n:r.p}))+'</small></td></tr>').join('');
  if(!rows.length)h+='<tr><td></td><td colspan="2">'+esc(t('empty'))+'</td></tr>';
  box.innerHTML=h+'</table>';
 }catch(e){box.innerHTML='<p>'+esc(t('rankerr'))+'</p>';}
}

// ===== まわす =====
let last=performance.now();
function frame(){
 requestAnimationFrame(frame);
 const nowP=performance.now(),now=nowP/1000,dt=Math.min(.05,(nowP-last)/1000);last=nowP;
 let ms=0,moodStop=false;
 if(mode==='title'||mode==='result'&&!RUN){ // タイトル：見本で流す
  if(!RUN)RUN=newRun(demoSeed);
  ms=nowP-demoT0;if(ms>45000){clearRun(RUN);demoSeed=(demoSeed*1664525+1013904223)>>>0;RUN=newRun(demoSeed);demoT0=nowP;ms=0;}
  while(RUN.L.T(RUN.next)<=ms){const i=RUN.next,it=RUN.items.get(i),k=RUN.L.K(i);hands[k].t0=now;if(it)applyTop(it,k,now);RUN.next++;}
  layout(RUN,ms,now);
 }else if(mode==='count'){
  const a=(nowP-G.cdT)/1000;
  if(a>2.2&&G.st!=null)beginPlay();
  else if(a>7){G.offline=true;G.st=Date.now();beginPlay();}
  else if(a>2.2)$('big').textContent=t('wait');
 }else if(mode==='play'){
  ms=nowP-G.t0;const T=RUN.L.T(RUN.next);
  if(ms>T+K.W+60)miss('pass',T+K.W,RUN.next);
  else{layout(RUN,ms,now);const sp=K.speed(ms);$('spdFill').style.width=(100*(sp-1.125)/(2.7-1.125))+'%';$('spdMax').hidden=ms<K.CAP;}
 }else if(mode==='stop'||mode==='result'){
  moodStop=true;if(RUN)layout(RUN,G.stopMs,now);
 }
 const r=now-ringT;ring.material.opacity=r<.35?.9*(1-r/.35):0;ring.scale.setScalar(1+r*1.2);
 const cy=(mode==='title'||mode==='result')?CAM.menu:CAM.play;CAM.y+=(cy-CAM.y)*Math.min(1,dt*5);placeCam();
 stepDrops(dt,now);poseWorker(now,moodStop?'stop':'');
 renderer.render(scene,camera);
}
applyLang();showTitle();requestAnimationFrame(frame);
window.__KL={get mode(){return mode},get G(){return G}};
</script>
